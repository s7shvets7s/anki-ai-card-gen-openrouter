<!doctype html>
<html lang="ru">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Anki AI Card Gen</title>
    <style>
      body {
        width: 400px;
        margin: 0;
        padding: 18px;
        color: #15171c;
        background: #fffaf0;
        font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      }
      h1 {
        margin: 0 0 10px;
        font-size: 21px;
        letter-spacing: 0;
      }
      p {
        margin: 0 0 16px;
        color: #66706f;
        font-size: 14px;
        line-height: 1.45;
      }
      .stack {
        display: grid;
        gap: 10px;
      }
      button {
        width: 100%;
        min-height: 44px;
        border: 0;
        border-radius: 8px;
        color: #fffaf0;
        background: #1d5b4f;
        font: inherit;
        font-weight: 750;
        cursor: pointer;
      }
      button.secondary {
        border: 1px solid #d7d0c3;
        color: #15171c;
        background: #ece5d8;
      }
      button.reader {
        color: #fff;
        background: #2f3b47;
      }
      #status {
        min-height: 20px;
        margin-top: 12px;
        color: #66706f;
        font-size: 13px;
        line-height: 1.4;
      }
      #siteState {
        margin-bottom: 12px;
        padding: 8px 10px;
        border-left: 3px solid #1d5b4f;
        background: #f1eee6;
        font-size: 12px;
      }
      #siteState[data-blocked="true"] { border-left-color: #8a2f3a; }
      button:disabled { cursor: not-allowed; opacity: .55; }
    </style>
  </head>
  <body>
    <h1>Anki AI Card Gen</h1>
    <p data-i18n="popupIntro">Выделите ровно одно слово. Текст рядом будет добавлен как контекст.</p>
    <div id="siteState"></div>
    <div class="stack">
      <button id="createButton" type="button" data-i18n="createSelection">Создать из выделения</button>
      <button id="readerButton" type="button" class="reader" data-i18n="openReader">Открыть PDF Reader</button>
      <button id="siteToggleButton" type="button" class="secondary"></button>
      <button id="optionsButton" type="button" class="secondary" data-i18n="openSettings">Открыть настройки</button>
    </div>
    <div id="status" role="status"></div>
    <script src="site-access.js"></script>
    <script src="i18n.js"></script>
    <script src="popup.js"></script>
  </body>
</html>
